<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="popup.css"><title>WEB SPIDER</title></head>
<body><header><div class="mark">✳</div><div><b>WEB SPIDER</b><small>FIELD EXPLORER · 1.0</small></div><span id="state" class="pill">READY</span></header><main>
<div class="site"><small>ACTIVE WEBSITE</small><strong id="site">Open a web page to begin</strong></div>
<section class="modes"><label>CRAWL MODE<select id="mode"><option value="current">Current page</option><option value="internal">Internal crawl</option><option value="deep">Deep crawl</option></select></label><div class="row"><label>MAX PAGES<input id="maxPages" type="number" min="1" max="300" value="20"></label><label>DEPTH<input id="maxDepth" type="number" min="0" max="10" value="2"></label><label>DELAY (s)<input id="delay" type="number" min="1" max="60" value="2"></label></div><label>INCLUDE URL PATTERNS<input id="include" placeholder="Optional regex, e.g. /blog/"></label><label>EXCLUDE URL PATTERNS<input id="exclude" placeholder="One regex per line"></label></section>
<div class="controls"><button class="primary" id="start">START</button><button id="pause">PAUSE</button><button id="resume">RESUME</button><button id="stop">STOP</button><button id="export">EXPORT</button></div>
<section class="toggles"><label><input type="checkbox" id="visual" checked> Spider animation</label><label><input type="checkbox" id="follow" checked> Mouse follow</label><label><input type="checkbox" id="auto"> Autonomous</label></section>
<div class="stats"><div><b id="scanned">0</b><small>SCANNED</small></div><div><b id="found">0</b><small>DISCOVERED</small></div><div><b id="links">0</b><small>LINKS</small></div><div><b id="images">0</b><small>IMAGES</small></div><div><b id="errors">0</b><small>ERRORS</small></div></div>
<div class="progress"><div id="bar"></div></div><div class="loghead">LIVE ACTIVITY <small id="pct">0%</small></div><div id="activity">Waiting for a crawl.</div><details id="collected"><summary>Latest collected page</summary><div id="preview">No page data collected yet.</div></details><details><summary>Recent scan log</summary><div id="logs"></div></details><footer>Spider walks over links and headings. Crawls remain on the starting site.</footer></main><script src="popup.js"></script></body></html>
